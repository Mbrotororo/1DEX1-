services:
  bot:
    build: .
    container_name: 1dex1-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # база, файлы и cookies.txt (YTDLP_COOKIES=/app/data/cookies.txt в .env)
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
