<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Письмо для тебя</title>
<meta name="description" content="Эта эмоция закрыта словом">
<meta property="og:title" content="Для тебя ♡">
<meta property="og:description" content="Эта эмоция закрыта словом">
<meta name="theme-color" content="#0d1626">
<link rel="stylesheet" href="fonts.css">

<script>
/* ============================================================
   НАСТРОЙКИ ОТКРЫТКИ — меняй только этот блок
   ============================================================ */
const CONFIG = {
  // Её имя: «<имя>, тебе письмо», надпись на конверте
  name: "Любимая",

  // Экран с замком
  title: "Эта эмоция закрыта словом",
  hint: "твои любимые цветы",
  // Любое из этих слов откроет письмо (регистр, пробелы и ё не важны)
  answers: ["розы", "роза"],

  // Само письмо. Каждая строка в кавычках — отдельный абзац
  greeting: "Моя хорошая,",
  letter: [
    "Я долго думал, как сказать это красиво, и решил просто написать. Ты делаешь мои дни теплее, даже когда сама об этом не знаешь.",
    "Спасибо за твой смех, за терпение и за то, что ты рядом, когда у меня что-то не получается. С тобой даже самый обычный вечер становится любимым.",
    "Вслух такие слова у меня выходят плохо, поэтому я спрятал их здесь. Возвращайся к ним, когда захочется.",
    "Я тебя очень люблю.",
  ],
  signature: "Навсегда твой",
  date: "",                 // например "16 ноября 2026", или оставь пустым

  // Необязательно: положи файлы в эту же папку и впиши имя файла
  photo: "",                // например "photo.jpg"
  photoCaption: "",         // подпись под фото
  music: "",                // например "song.mp3" — заиграет после верного слова

  sealColor: "#2b58a8",     // цвет сургучной печати
};
</script>

<style>
/* Night sky blue with a pool of cold light; one paper letter in blue ink. Single dark look on purpose. */
:root {
  --night-0: #0b1322;
  --night-1: #15243b;
  --night-2: #22395a;
  --glow: rgba(150, 190, 255, 0.22);
  --frost: #eef3ff;
  --frost-dim: #b6c6e3;
  --ice: #9ccaff;
  --ice-hi: #c9e4ff;
  --ice-ink: #0f2340;
  --paper: #f5f1e8;
  --paper-edge: #e6dfd1;
  --env-out: #f1eadd;
  --env-in: #ddd3c1;
  --ink: #1f3a6e;
  --ink-soft: rgba(31, 58, 110, 0.62);
  --wax: #2b58a8;
  --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --script: "Marck Script", "Segoe Script", "Bradley Hand", cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night-0);
  color: var(--frost);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.backdrop {
  position: fixed; inset: 0;
  background:
    radial-gradient(60% 42% at 50% 46%, var(--glow), transparent 70%),
    linear-gradient(180deg, var(--night-0) 0%, var(--night-1) 55%, var(--night-2) 100%);
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.scene {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  opacity: 0; visibility: hidden;
  transition: opacity 0.9s ease, visibility 0s linear 0.9s;
}
.scene.is-active { opacity: 1; visibility: visible; transition: opacity 0.9s ease, visibility 0s; }

/* ---------- 1. Lock ---------- */
.lock-inner {
  width: min(100%, 24rem);
  display: grid; justify-items: center; gap: 0.9rem;
  text-align: center;
  transition: opacity 0.7s ease, transform 0.7s ease, filter 0.7s ease;
}
.lock-title {
  margin: 0;
  font-weight: 500;
  font-size: clamp(1.75rem, 7vw, 2.35rem);
  line-height: 1.15;
  letter-spacing: 0.005em;
  text-wrap: balance;
  text-shadow: 0 0 22px rgba(170, 205, 255, 0.35);
}
.lock-hint {
  margin: -0.2rem 0 0.9rem;
  font-family: var(--script);
  font-size: clamp(1.2rem, 4.6vw, 1.45rem);
  color: var(--frost-dim);
}
.lock-form { width: 100%; display: grid; gap: 0.75rem; }
.lock-form input, .lock-form button {
  width: 100%; height: 3.3rem;
  border-radius: 999px;
  font-family: var(--serif); font-size: 1.2rem; font-weight: 600;
  text-align: center;
}
.lock-form input {
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.07);
  color: var(--frost);
  outline: none;
  transition: border-color 0.25s, background 0.25s;
}
.lock-form input::placeholder { color: rgba(238, 243, 255, 0.42); font-weight: 500; }
.lock-form input:focus { border-color: rgba(201, 228, 255, 0.55); background: rgba(255, 255, 255, 0.1); }
.lock-form button {
  border: 0; cursor: pointer;
  color: var(--ice-ink);
  background: linear-gradient(180deg, var(--ice-hi), var(--ice));
  box-shadow: 0 0 34px rgba(156, 202, 255, 0.5), 0 10px 26px rgba(0, 0, 0, 0.35);
  letter-spacing: 0.02em;
  transition: transform 0.15s ease, box-shadow 0.3s ease;
}
.lock-form button:active { transform: scale(0.97); }
.lock-form button:focus-visible, .heart-btn:focus-visible, .music-btn:focus-visible, .envelope:focus-visible {
  outline: 2px solid var(--ice-hi); outline-offset: 4px;
}
.lock-msg {
  min-height: 1.5em; margin: 0.2rem 0 0;
  font-family: var(--script); font-size: 1.15rem; color: var(--frost-dim);
}
.lock-form.is-wrong input { animation: shake 0.45s ease; border-color: rgba(255, 170, 190, 0.6); }
@keyframes shake {
  20% { transform: translateX(-9px); } 40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); } 80% { transform: translateX(3px); }
}
.lock.is-unlocking .lock-inner { opacity: 0; transform: translateY(-14px) scale(0.98); filter: blur(3px); }

/* ---------- 2. Reveal ---------- */
.reveal-text { text-align: center; display: grid; gap: 0.2rem; }
.reveal-name {
  margin: 0; font-family: var(--script);
  font-size: clamp(2.4rem, 11vw, 3.4rem);
  text-shadow: 0 0 26px rgba(185, 215, 255, 0.55);
}
.reveal-line {
  margin: 0; font-weight: 500;
  font-size: clamp(1.8rem, 8vw, 2.5rem);
  text-shadow: 0 0 22px rgba(185, 215, 255, 0.45);
}
.reveal.is-active .reveal-name, .reveal.is-active .reveal-line { animation: bloom 1.6s ease both; }
.reveal.is-active .reveal-line { animation-delay: 0.35s; }
@keyframes bloom {
  from { opacity: 0; filter: blur(10px); letter-spacing: 0.25em; }
  to { opacity: 1; filter: blur(0); letter-spacing: 0.01em; }
}

/* ---------- 3. Envelope ---------- */
.env-stage { display: grid; justify-items: center; gap: 2.2rem; }
.env-float { animation: bob 4.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-9px); } }
.envelope {
  position: relative; display: block;
  width: min(80vw, 22rem); aspect-ratio: 10 / 7; max-width: 100%;
  padding: 0; border: 0; background: none; cursor: pointer;
  filter: drop-shadow(0 22px 34px rgba(0, 0, 0, 0.5));
}
.env-back, .env-front, .env-flap, .env-letter { position: absolute; }
.env-back { inset: 0; background: var(--env-in); border-radius: 6px; z-index: 1; }
.env-letter {
  left: 6%; right: 6%; top: 7%; bottom: 8%;
  z-index: 2;
  border-radius: 3px;
  background:
    repeating-linear-gradient(180deg, transparent 0 15px, rgba(31, 58, 110, 0.12) 15px 16px) 12% 26% / 76% 60% no-repeat,
    var(--paper);
  transition: transform 0.95s cubic-bezier(0.3, 0.7, 0.2, 1) 1s;
}
.env-front {
  inset: 0; z-index: 3; border-radius: 6px;
  background: linear-gradient(170deg, #f7f1e6, var(--env-out) 60%, #e9e0cf);
  clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
}
.env-front::before, .env-front::after {
  content: ""; position: absolute; bottom: 0; width: 60%; height: 100%;
  background: linear-gradient(0deg, rgba(0, 0, 0, 0.035), transparent);
}
.env-front::before { left: 0; clip-path: polygon(0 100%, 0 0, 100% 100%); }
.env-front::after { right: 0; clip-path: polygon(100% 100%, 100% 0, 0 100%); }
.env-to {
  position: absolute; left: 0; right: 0; bottom: 8%;
  text-align: center;
  font-family: var(--script); font-size: clamp(1.25rem, 5.4vw, 1.6rem);
  color: var(--ink);
  opacity: 0.85;
}
.env-flap {
  left: 0; right: 0; top: 0; height: 53%;
  z-index: 4;
  background: linear-gradient(180deg, #ece4d5, #f6f0e5);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: 50% 0;
  transform: perspective(900px) rotateX(0deg);
  transition: transform 0.85s cubic-bezier(0.55, 0.1, 0.3, 1) 0.3s, z-index 0s linear 0.72s, background 0s linear 0.72s;
}
.seal {
  position: absolute; left: 50%; top: 53%; z-index: 5;
  width: clamp(52px, 16vw, 64px); aspect-ratio: 1;
  transform: translate(-50%, -50%);
  transition: transform 0.4s ease, opacity 0.35s ease 0.12s;
  animation: seal-pulse 2.6s ease-in-out infinite;
  border-radius: 50%;
}
.seal svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); }
@keyframes seal-pulse {
  50% { box-shadow: 0 0 0 10px rgba(156, 202, 255, 0.13), 0 0 30px rgba(156, 202, 255, 0.35); }
}
.envelope.is-open .seal { transform: translate(-50%, -50%) scale(1.3) rotate(-14deg); opacity: 0; animation: none; }
.envelope.is-open .env-flap { transform: perspective(900px) rotateX(180deg); z-index: 1; background: var(--env-in); }
.envelope.is-open .env-letter { transform: translateY(-56%); }
.env-stage.is-opening .env-float { animation-play-state: paused; }
.env-caption {
  margin: 0; font-family: var(--script);
  font-size: clamp(1.35rem, 5.4vw, 1.6rem);
  color: var(--frost-dim);
  text-shadow: 0 0 16px rgba(170, 205, 255, 0.3);
}
.env-scene.is-leaving .env-stage { transform: translateY(-24px) scale(1.06); opacity: 0; transition: transform 0.8s ease, opacity 0.8s ease; }

/* ---------- 4. Letter ---------- */
.letter-scene { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.letter-scene.is-active { transition: opacity 0.3s ease, visibility 0s; }
.letter-scene.is-active .letter { opacity: 1; transform: none; }
.letter {
  width: 100%; max-width: 34rem;
  margin: clamp(8px, 4vh, 48px) auto 0;
  padding: clamp(30px, 7vw, 56px) clamp(22px, 6.5vw, 54px) clamp(30px, 6vw, 48px);
  color: var(--ink);
  background:
    radial-gradient(120% 70% at 20% 0%, rgba(255, 255, 255, 0.55), transparent 60%),
    radial-gradient(90% 60% at 100% 100%, rgba(214, 200, 175, 0.35), transparent 70%),
    var(--paper);
  border-radius: 4px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 0 0 1px var(--paper-edge);
  opacity: 0; transform: translateY(40px) scale(0.96);
  transition: opacity 0.6s ease 0.1s, transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s;
}
.letter-date { margin: 0 0 0.6rem; text-align: right; font-style: italic; font-size: 1rem; color: var(--ink-soft); }
.letter-greeting { margin: 0 0 1.1rem; font-family: var(--script); font-size: clamp(1.9rem, 7.5vw, 2.3rem); line-height: 1.1; }
.letter-body { display: grid; gap: 1rem; }
.letter-body p {
  margin: 0;
  font-weight: 500; font-size: clamp(1.17rem, 4.4vw, 1.3rem); line-height: 1.62;
  text-wrap: pretty; white-space: pre-line;
}
.fade-in { opacity: 0; transform: translateY(10px); filter: blur(5px); transition: opacity 1s ease, transform 1s ease, filter 1s ease; }
.fade-in.is-in { opacity: 1; transform: none; filter: none; }
.letter-photo {
  margin: 1.8rem auto 0.4rem; width: min(100%, 17rem);
  padding: 10px 10px 0; background: #fff;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
  transform: rotate(-2.2deg);
}
.letter-photo.is-in { transform: rotate(-2.2deg); }
.letter-photo img { display: block; width: 100%; max-width: 100%; height: auto; }
.letter-photo figcaption { padding: 0.5rem 0 0.7rem; text-align: center; font-family: var(--script); font-size: 1.2rem; color: var(--ink); }
.letter-photo:not(:has(figcaption:not(:empty))) { padding-bottom: 28px; }
.letter-sign { margin: 1.6rem 0 0; text-align: right; font-family: var(--script); font-size: clamp(1.6rem, 6vw, 1.95rem); }
.letter-end { margin-top: 1.8rem; display: grid; justify-items: center; gap: 0.35rem; }
.heart-btn {
  width: 62px; height: 62px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1.5px solid rgba(31, 58, 110, 0.35);
  background: rgba(255, 255, 255, 0.45);
  color: var(--ink); cursor: pointer;
  transition: transform 0.2s ease, background 0.3s;
}
.heart-btn svg { width: 28px; height: 28px; }
.heart-btn:active { transform: scale(0.9); }
.heart-btn.is-beat { animation: beat 0.6s ease; }
@keyframes beat { 30% { transform: scale(1.18); } 60% { transform: scale(0.96); } }
.letter-end small { font-style: italic; font-size: 0.95rem; color: var(--ink-soft); }
.letter-pad { height: clamp(24px, 6vh, 56px); }

.music-btn {
  position: fixed; z-index: 20;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: calc(14px + env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.08); color: var(--frost);
  font-size: 1.2rem; cursor: pointer;
  backdrop-filter: blur(6px);
}
.music-btn[aria-pressed="false"] { opacity: 0.45; }

@media (prefers-reduced-motion: reduce) {
  .env-float, .seal { animation: none; }
  .reveal.is-active .reveal-name, .reveal.is-active .reveal-line { animation: none; }
  .fade-in { filter: none; transform: none; }
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<canvas id="sky" aria-hidden="true"></canvas>

<main>
  <!-- 1. Замок -->
  <section class="scene lock is-active" id="lock" aria-labelledby="lock-title">
    <div class="lock-inner">
      <h1 class="lock-title" id="lock-title"></h1>
      <p class="lock-hint" id="lock-hint"></p>
      <form class="lock-form" id="lock-form" autocomplete="off">
        <label class="sr-only" for="word">Слово</label>
        <input id="word" name="word" type="text" placeholder="слово" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button type="submit" id="open-btn">Открыть</button>
      </form>
      <p class="lock-msg" id="lock-msg" aria-live="polite"></p>
    </div>
  </section>

  <!-- 2. «…, тебе письмо» -->
  <section class="scene reveal" id="reveal" aria-live="polite">
    <div class="reveal-text">
      <p class="reveal-name" id="reveal-name"></p>
      <p class="reveal-line">тебе письмо</p>
    </div>
  </section>

  <!-- 3. Конверт -->
  <section class="scene env-scene" id="env-scene">
    <div class="env-stage" id="env-stage">
      <div class="env-float">
        <button class="envelope" id="envelope" type="button" aria-label="Открыть конверт">
          <span class="env-back"></span>
          <span class="env-letter"></span>
          <span class="env-front"><span class="env-to" id="env-to"></span></span>
          <span class="env-flap"></span>
          <span class="seal" id="seal"></span>
        </button>
      </div>
      <p class="env-caption" id="env-caption">открой, это тебе</p>
    </div>
  </section>

  <!-- 4. Письмо -->
  <section class="scene letter-scene" id="letter-scene">
    <article class="letter" id="letter">
      <p class="letter-date fade-in" id="letter-date"></p>
      <p class="letter-greeting fade-in" id="letter-greeting"></p>
      <div class="letter-body" id="letter-body"></div>
      <figure class="letter-photo fade-in" id="letter-photo" hidden>
        <img id="photo-img" alt="">
        <figcaption id="photo-caption"></figcaption>
      </figure>
      <p class="letter-sign fade-in" id="letter-sign"></p>
      <div class="letter-end fade-in" id="letter-end">
        <button class="heart-btn" id="heart-btn" type="button" aria-label="Отправить сердечки">
          <svg viewBox="-0.6 -0.6 1.2 1.2" aria-hidden="true"><path d="M0 0.5C-0.15 0.35-0.5 0.15-0.5-0.12C-0.5-0.42-0.12-0.5 0-0.25C0.12-0.5 0.5-0.42 0.5-0.12C0.5 0.15 0.15 0.35 0 0.5Z" fill="currentColor"/></svg>
        </button>
        <small>нажми</small>
      </div>
    </article>
    <div class="letter-pad"></div>
  </section>
</main>

<button class="music-btn" id="music-btn" type="button" aria-pressed="true" aria-label="Музыка" hidden>♪</button>

<script>
(function () {
  'use strict';
  const C = CONFIG;
  const $ = (id) => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? Math.min(ms, 350) : ms));
  const norm = (s) => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]/g, '');

  /* ---------- fill texts ---------- */
  $('lock-title').textContent = C.title;
  $('lock-hint').textContent = C.hint;
  $('reveal-name').textContent = C.name + ',';
  $('env-to').textContent = C.name;
  $('letter-greeting').textContent = C.greeting;
  $('letter-sign').textContent = C.signature;
  if (C.date) $('letter-date').textContent = C.date; else $('letter-date').remove();
  const body = $('letter-body');
  (C.letter || []).forEach((t) => {
    const p = document.createElement('p');
    p.className = 'fade-in';
    p.textContent = t;
    body.appendChild(p);
  });
  if (C.photo) {
    $('photo-img').src = C.photo;
    $('photo-caption').textContent = C.photoCaption || '';
    $('letter-photo').hidden = false;
  } else {
    $('letter-photo').remove();
  }
  document.documentElement.style.setProperty('--wax', C.sealColor || '#2b58a8');

  /* ---------- wax seal (generated blob) ---------- */
  (function buildSeal() {
    const pts = [];
    const lobes = 13;
    for (let i = 0; i < lobes * 2; i++) {
      const a = (i / (lobes * 2)) * Math.PI * 2;
      const r = i % 2 ? 46 : 42.5 + (i * 7 % 5) * 0.6;
      pts.push([50 + Math.cos(a) * r, 50 + Math.sin(a) * r]);
    }
    let d = '';
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      d += (i === 0 ? 'M' + mx.toFixed(2) + ' ' + my.toFixed(2) : '') + 'Q' + q[0].toFixed(2) + ' ' + q[1].toFixed(2) + ' ' +
        ((q[0] + pts[(i + 2) % pts.length][0]) / 2).toFixed(2) + ' ' + ((q[1] + pts[(i + 2) % pts.length][1]) / 2).toFixed(2);
    }
    const heart = 'M0 0.5C-0.15 0.35-0.5 0.15-0.5-0.12C-0.5-0.42-0.12-0.5 0-0.25C0.12-0.5 0.5-0.42 0.5-0.12C0.5 0.15 0.15 0.35 0 0.5Z';
    $('seal').innerHTML =
      '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<defs><radialGradient id="wax" cx="38%" cy="32%" r="75%">' +
      '<stop offset="0" style="stop-color:color-mix(in srgb, var(--wax) 70%, white)"/>' +
      '<stop offset="0.55" style="stop-color:var(--wax)"/>' +
      '<stop offset="1" style="stop-color:color-mix(in srgb, var(--wax) 55%, black)"/></radialGradient></defs>' +
      '<path d="' + d + 'Z" fill="url(#wax)"/>' +
      '<circle cx="50" cy="50" r="31" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="2.4"/>' +
      '<circle cx="50.8" cy="50.8" r="31" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1"/>' +
      '<path d="' + heart + '" transform="translate(51 52) scale(30)" fill="rgba(255,255,255,.2)"/>' +
      '<path d="' + heart + '" transform="translate(50 51) scale(30)" fill="rgba(0,0,0,.26)"/>' +
      '</svg>';
  })();

  /* ---------- scenes ---------- */
  function show(id) {
    document.querySelectorAll('.scene').forEach((s) => s.classList.toggle('is-active', s.id === id));
  }

  /* ---------- music ---------- */
  let audio = null;
  const musicBtn = $('music-btn');
  function startMusic() {
    if (!C.music || audio) return;
    audio = new Audio(C.music);
    audio.loop = true;
    audio.volume = 0.55;
    audio.play().then(() => { musicBtn.hidden = false; }).catch(() => { musicBtn.hidden = false; musicBtn.setAttribute('aria-pressed', 'false'); });
  }
  musicBtn.addEventListener('click', () => {
    if (!audio) return;
    if (audio.paused) { audio.play().catch(() => {}); musicBtn.setAttribute('aria-pressed', 'true'); }
    else { audio.pause(); musicBtn.setAttribute('aria-pressed', 'false'); }
  });

  /* ---------- 1. lock ---------- */
  const form = $('lock-form');
  const input = $('word');
  const msg = $('lock-msg');
  const answers = (C.answers || []).map(norm).filter(Boolean);
  const misses = ['не то слово…', 'подумай ещё', 'почти. попробуй ещё раз'];
  let tries = 0;
  let unlocked = false;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (unlocked) return;
    const guess = norm(input.value);
    if (!guess) { input.focus(); return; }
    if (!answers.includes(guess)) {
      tries++;
      const first = (C.answers && C.answers[0] || '').trim().charAt(0).toLowerCase();
      msg.textContent = tries >= 3 && first ? 'подсказка: начинается на «' + first + '»' : misses[(tries - 1) % misses.length];
      form.classList.remove('is-wrong'); void form.offsetWidth; form.classList.add('is-wrong');
      input.select();
      return;
    }
    unlocked = true;
    input.blur();
    msg.textContent = '';
    startMusic();
    sky.flash();
    $('lock').classList.add('is-unlocking');
    await wait(800);
    show('reveal');
    await wait(2900);
    show('env-scene');
    setTimeout(() => $('envelope').focus({ preventScroll: true }), 950);
  });

  /* ---------- 3. envelope ---------- */
  let opened = false;
  $('envelope').addEventListener('click', async () => {
    if (opened) return;
    opened = true;
    $('env-caption').textContent = 'открываю…';
    $('env-stage').classList.add('is-opening');
    $('envelope').classList.add('is-open');
    await wait(2100);
    $('env-scene').classList.add('is-leaving');
    await wait(500);
    show('letter-scene');
    sky.setMode('hearts');
    await wait(350);
    const items = $('letter').querySelectorAll('.fade-in');
    for (const el of items) {
      el.classList.add('is-in');
      await wait(el.tagName === 'P' && el.parentNode.id === 'letter-body' ? 1100 : 650);
    }
  });

  /* ---------- 4. hearts ---------- */
  $('heart-btn').addEventListener('click', (e) => {
    const b = e.currentTarget;
    b.classList.remove('is-beat'); void b.offsetWidth; b.classList.add('is-beat');
    const r = b.getBoundingClientRect();
    sky.burst(r.left + r.width / 2, r.top + r.height / 2);
  });

  /* ---------- sky: dust, falling hearts, bursts ---------- */
  const sky = (function () {
    const cv = $('sky');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, mode = 'dust', flashT = 0, last = performance.now();
    const dust = [], falling = [], bursts = [];
    const HEART = new Path2D('M0 0.5C-0.15 0.35-0.5 0.15-0.5-0.12C-0.5-0.42-0.12-0.5 0-0.25C0.12-0.5 0.5-0.42 0.5-0.12C0.5 0.15 0.15 0.35 0 0.5Z');
    const tints = ['#ffffff', '#cfe3ff', '#ffd3e2', '#a9cdfc', '#f6b3cb'];
    const rnd = (a, b) => a + Math.random() * (b - a);

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function newDust(anywhere) {
      return { x: rnd(0, W), y: anywhere ? rnd(0, H) : H + 10, r: rnd(0.5, 1.9), vy: rnd(-9, -3), vx: rnd(-3, 3), ph: rnd(0, 6.28), sp: rnd(0.6, 1.6) };
    }
    function newHeart(anywhere) {
      return { x: rnd(0, W), y: anywhere ? rnd(-H, 0) : -20, s: rnd(7, 16), vy: rnd(18, 42), sw: rnd(10, 26), ph: rnd(0, 6.28), rot: rnd(-0.5, 0.5), vr: rnd(-0.6, 0.6), a: rnd(0.35, 0.8), c: tints[(Math.random() * tints.length) | 0] };
    }
    function setMode(m) {
      mode = m;
      if (m === 'hearts') for (let i = 0; i < Math.round(Math.min(34, W / 14)); i++) falling.push(newHeart(true));
    }
    function burst(x, y) {
      if (reduce) return;
      for (let i = 0; i < 26; i++) {
        const a = rnd(0, Math.PI * 2), v = rnd(120, 330);
        bursts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 140, s: rnd(9, 20), rot: rnd(-0.6, 0.6), vr: rnd(-3, 3), life: 0, max: rnd(1.1, 1.8), c: tints[(Math.random() * tints.length) | 0] });
      }
    }
    function flash() { flashT = 1; }
    function drawHeart(x, y, s, rot, color, alpha) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
      ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fill(HEART); ctx.restore();
    }
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      ctx.clearRect(0, 0, W, H);
      if (flashT > 0) {
        const g = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, Math.max(W, H) * 0.7);
        g.addColorStop(0, 'rgba(190,220,255,' + (0.35 * flashT) + ')'); g.addColorStop(1, 'rgba(190,220,255,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); flashT = Math.max(0, flashT - dt * 0.9);
      }
      for (const p of dust) {
        p.y += p.vy * dt; p.x += p.vx * dt; p.ph += p.sp * dt;
        if (p.y < -10) Object.assign(p, newDust(false));
        ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(p.ph));
        ctx.fillStyle = '#d6e6ff';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (mode === 'hearts') {
        for (const h of falling) {
          h.y += h.vy * dt; h.ph += dt * 1.3; h.rot += h.vr * dt;
          if (h.y > H + 30) Object.assign(h, newHeart(false));
          drawHeart(h.x + Math.sin(h.ph) * h.sw, h.y, h.s, h.rot, h.c, h.a);
        }
      }
      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.life += dt; b.vy += 420 * dt; b.vx *= 0.985; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
        const k = 1 - b.life / b.max;
        if (k <= 0) { bursts.splice(i, 1); continue; }
        drawHeart(b.x, b.y, b.s, b.rot, b.c, Math.min(1, k * 1.6));
      }
      requestAnimationFrame(frame);
    }
    resize();
    window.addEventListener('resize', resize);
    if (!reduce) {
      for (let i = 0; i < Math.round(Math.min(60, W / 9)); i++) dust.push(newDust(true));
    }
    requestAnimationFrame(frame);
    return { setMode: (m) => { if (!reduce) setMode(m); }, burst, flash: () => { if (!reduce) flash(); } };
  })();
})();
</script>
</body>
</html>
